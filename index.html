<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buon Compleanno!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0a0a0a;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    height: 100%;
    width: 100%;
    position: fixed;
  }

  /* ===== CONFETTI ===== */
  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -10px;
    animation: confettiFall linear infinite;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }

  /* ===== PAGE 1 ===== */
  #page1 {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: radial-gradient(ellipse at 50% 40%, #1a1200 0%, #0a0a0a 70%);
    z-index: 10;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #page1.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  .page1-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.2rem, 5vw, 2.8rem);
    color: #c9a227;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
    text-shadow: 0 0 30px rgba(201,162,39,0.5);
    animation: fadeDown 0.8s ease both;
    text-align: center;
  }

  /* ===== VOUCHER ===== */
  .voucher-wrapper {
    position: relative;
    animation: floatVoucher 3s ease-in-out infinite, fadeUp 0.9s ease both 0.2s;
    filter: drop-shadow(0 20px 60px rgba(201,162,39,0.35));
    width: min(90vw, 620px);
  }

  .voucher-svg-wrap {
    width: 100%;
    display: block;
  }

  .voucher-inner-text {
    position: absolute;
    top: 50%;
    left: 8%;
    right: 12%;
    transform: translateY(-50%);
    text-align: center;
    pointer-events: none;
  }
  .voucher-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.55rem, 2vw, 1rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(60,40,0,0.7);
    display: block;
    margin-bottom: 0.3em;
  }
  .voucher-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 4.5vw, 2.4rem);
    font-weight: 700;
    color: #3a2800;
    letter-spacing: 0.03em;
    line-height: 1.15;
  }
  .voucher-deco {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    margin-top: 0.5em;
    color: rgba(60,40,0,0.5);
    font-size: clamp(0.5rem, 1.5vw, 0.8rem);
    letter-spacing: 0.25em;
  }
  .voucher-deco::before, .voucher-deco::after { content: '✦'; font-size: 0.7em; }

  /* ===== CTA BUTTON ===== */
  .cta-btn {
    margin-top: clamp(1.5rem, 4vw, 2.8rem);
    padding: 0.85rem 3rem;
    background: linear-gradient(135deg, #c9a227 0%, #f5d878 45%, #c9a227 100%);
    border: none;
    border-radius: 60px;
    font-family: 'Playfair Display', serif;
    font-size: clamp(0.9rem, 3vw, 1.35rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #2a1a00;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.9s ease both 0.5s;
    box-shadow: 0 8px 30px rgba(201,162,39,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .cta-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 2.5s ease-in-out infinite;
  }
  .cta-btn:active { transform: scale(0.97); }

  /* ===== PAGE 2 ===== */
  #page2 {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
    background: linear-gradient(180deg, #87ceeb 0%, #b8e4f5 35%, #d4f0a0 60%, #6db33f 70%);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease 0.3s;
  }
  #page2.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* Back button */
  .back-btn {
    position: absolute;
    top: clamp(12px, 3vw, 20px);
    left: clamp(12px, 3vw, 20px);
    z-index: 50;
    background: rgba(255,255,255,0.85);
    border: 2px solid #c9a227;
    border-radius: 50px;
    padding: 0.5rem 1.2rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    font-weight: 600;
    color: #3a2800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4em;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: transform 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    animation: none;
  }
  #page2.visible .back-btn {
    opacity: 1;
    animation: fadeDown 0.5s ease forwards 0.8s;
  }
  .back-btn:active { transform: scale(0.95); }
  .back-btn::before { content: '←'; font-size: 1.1em; }

  /* sun */
  .sun {
    position: absolute;
    top: 5%;
    right: 10%;
    width: clamp(50px,10vw,90px);
    height: clamp(50px,10vw,90px);
    background: radial-gradient(circle, #fff7a0 30%, #ffd700 65%, transparent 100%);
    border-radius: 50%;
    box-shadow: 0 0 60px 20px rgba(255,215,0,0.35);
    animation: sunPulse 4s ease-in-out infinite;
  }

  /* clouds */
  .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.85; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }
  .cloud1 { width: clamp(70px,12vw,120px); height: clamp(22px,3.5vw,38px); top: 12%; left: 5%; animation: cloudDrift 18s linear infinite; }
  .cloud1::before { width: 55%; height: 165%; top: -83%; left: 15%; }
  .cloud1::after { width: 38%; height: 132%; top: -50%; left: 45%; }
  .cloud2 { width: clamp(55px,9vw,90px); height: clamp(17px,2.8vw,28px); top: 20%; left: 38%; animation: cloudDrift 25s linear infinite 5s; }
  .cloud2::before { width: 52%; height: 170%; top: -90%; left: 13%; }
  .cloud2::after { width: 36%; height: 130%; top: -50%; left: 45%; }
  .cloud3 { width: clamp(45px,7vw,70px); height: clamp(14px,2.2vw,22px); top: 7%; left: 58%; animation: cloudDrift 20s linear infinite 10s; }
  .cloud3::before { width: 52%; height: 170%; top: -80%; left: 11%; }
  .cloud3::after { width: 38%; height: 130%; top: -50%; left: 44%; }

  /* hills */
  .hills-layer {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 65%;
  }

  /* road */
  .road {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: clamp(40px, 10vh, 85px);
    background: linear-gradient(180deg, #555 0%, #444 100%);
    z-index: 2;
  }
  .road::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #f5d878;
    opacity: 0.5;
  }

  /* car scene */
  .car-scene {
    position: absolute;
    bottom: clamp(36px, 9.5vh, 80px);
    left: -320px;
    animation: carDrive 4s cubic-bezier(0.25,0.1,0.25,1) forwards 0.8s;
    z-index: 20;
  }
  .car-svg {
    width: clamp(160px, 32vw, 260px);
    display: block;
  }

  /* speed lines */
  .speed-lines {
    position: absolute;
    right: 100%;
    top: 25%;
    display: flex;
    flex-direction: column;
    gap: 7px;
    opacity: 0;
    animation: speedShow 4s ease forwards 0.8s;
  }
  .speed-line {
    height: 3px;
    background: linear-gradient(to left, rgba(255,255,255,0.7), transparent);
    border-radius: 2px;
  }

  /* reveal text */
  .reveal-text {
    position: absolute;
    bottom: clamp(120px, 24vh, 210px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 30;
    opacity: 0;
    animation: textPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards 4.6s;
    white-space: nowrap;
  }
  .reveal-text .line1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.1rem, 4.5vw, 2.5rem);
    color: #2a4a00;
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
    display: block;
  }
  .reveal-text .line2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 7vw, 4rem);
    font-weight: 700;
    color: #1a3300;
    display: block;
    letter-spacing: 0.04em;
    text-shadow: 0 3px 12px rgba(255,255,255,0.5);
  }
  .reveal-text .line3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.8rem, 2.5vw, 1.5rem);
    color: #3a5a10;
    display: block;
    letter-spacing: 0.12em;
    margin-top: 0.2em;
    font-style: italic;
  }

  /* ===== KEYFRAMES ===== */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatVoucher {
    0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
    50% { transform: translateY(-10px) rotate(0.4deg); }
  }
  @keyframes shimmer {
    0% { left: -100%; }
    60%, 100% { left: 150%; }
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes cloudDrift {
    from { transform: translateX(-200px); }
    to { transform: translateX(110vw); }
  }
  @keyframes carDrive {
    0% { left: -320px; }
    70% { left: clamp(40px, 10vw, 120px); }
    80% { left: clamp(30px, 8vw, 100px); }
    100% { left: clamp(40px, 10vw, 120px); }
  }
  @keyframes speedShow {
    0%, 58% { opacity: 1; }
    85%, 100% { opacity: 0; }
  }
  @keyframes textPop {
    from { opacity: 0; transform: translateX(-50%) scale(0.7); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes roadDash {
    from { transform: translateX(200px) translateY(-50%); opacity:1; }
    to   { transform: translateX(-200px) translateY(-50%); opacity:0; }
  }
</style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<!-- PAGE 1 -->
<div id="page1">
  <p class="page1-title">Aspetta… c'è qualcosa per te</p>

  <div class="voucher-wrapper">
    <svg class="voucher-svg-wrap" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#b8860b"/>
          <stop offset="18%" style="stop-color:#f5d878"/>
          <stop offset="44%" style="stop-color:#fdf0a0"/>
          <stop offset="64%" style="stop-color:#e8c230"/>
          <stop offset="82%" style="stop-color:#c9a227"/>
          <stop offset="100%" style="stop-color:#8b6914"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0%" y1="10%" x2="80%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
          <stop offset="40%" style="stop-color:rgba(255,255,255,0.22)"/>
          <stop offset="60%" style="stop-color:rgba(255,255,255,0.08)"/>
          <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
        </linearGradient>
        <filter id="voucherShadow" x="-5%" y="-5%" width="115%" height="125%">
          <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="rgba(0,0,0,0.5)"/>
        </filter>
        <clipPath id="ticketShape">
          <path d="M40,20 Q40,8 52,8 L628,8 Q640,8 640,20
            L640,145 Q628,145 628,158 Q628,170 640,170
            L640,350 Q640,362 628,362 L52,362 Q40,362 40,350
            L40,170 Q52,170 52,158 Q52,145 40,145 Z"/>
        </clipPath>
      </defs>

      <g filter="url(#voucherShadow)">
        <!-- gold body -->
        <path d="M40,20 Q40,8 52,8 L628,8 Q640,8 640,20
          L640,145 Q628,145 628,158 Q628,170 640,170
          L640,350 Q640,362 628,362 L52,362 Q40,362 40,350
          L40,170 Q52,170 52,158 Q52,145 40,145 Z"
          fill="url(#goldBase)"/>
        <!-- sheen -->
        <path d="M40,20 Q40,8 52,8 L628,8 Q640,8 640,20
          L640,145 Q628,145 628,158 Q628,170 640,170
          L640,350 Q640,362 628,362 L52,362 Q40,362 40,350
          L40,170 Q52,170 52,158 Q52,145 40,145 Z"
          fill="url(#sheen)"/>
        <!-- serrated right edge mask -->
        <g clip-path="url(#ticketShape)">
          <path d="M628,8 L668,8 L668,22 L655,29 L668,36 L655,43 L668,50 L655,57
            L668,64 L655,71 L668,78 L655,85 L668,92 L655,99 L668,106
            L655,113 L668,120 L655,127 L668,134 L655,141 L668,145
            Q655,145 655,158 Q655,170 668,170
            L668,177 L655,184 L668,191 L655,198 L668,205 L655,212
            L668,219 L655,226 L668,233 L655,240 L668,247 L655,254
            L668,261 L655,268 L668,275 L655,282 L668,289 L655,296
            L668,303 L655,310 L668,317 L655,324 L668,331 L655,338
            L668,345 L655,352 L668,359 L668,362 L628,362 Z"
            fill="#0a0a0a"/>
        </g>
        <!-- inner border -->
        <rect x="60" y="24" width="548" height="316" rx="4"
              fill="none" stroke="rgba(60,40,0,0.5)" stroke-width="1.5"/>
        <!-- corner ornaments TL -->
        <path d="M68,32 L86,32 M68,32 L68,52 M84,32 Q68,32 68,48"
              fill="none" stroke="rgba(60,40,0,0.55)" stroke-width="1.5"/>
        <!-- TR -->
        <path d="M544,32 L606,32 M606,32 L606,52 M590,32 Q606,32 606,48"
              fill="none" stroke="rgba(60,40,0,0.55)" stroke-width="1.5"/>
        <!-- BL -->
        <path d="M68,336 L86,336 M68,336 L68,316 M84,336 Q68,336 68,320"
              fill="none" stroke="rgba(60,40,0,0.55)" stroke-width="1.5"/>
        <!-- BR -->
        <path d="M544,336 L606,336 M606,336 L606,316 M590,336 Q606,336 606,320"
              fill="none" stroke="rgba(60,40,0,0.55)" stroke-width="1.5"/>
      </g>
    </svg>

    <div class="voucher-inner-text">
      <span class="voucher-label">&nbsp; Speciale per te &nbsp;</span>
      <span class="voucher-main">IN REGALO<br>PER TE</span>
      <div class="voucher-deco">voucher esclusivo</div>
    </div>
  </div>

  <button class="cta-btn" onclick="showPage2()">SCOPRILO ORA</button>
</div>


<!-- PAGE 2 -->
<div id="page2">

  <!-- BACK BUTTON -->
  <button class="back-btn" onclick="goBack()">Indietro</button>

  <!-- Sky -->
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <!-- HILLS SVG -->
  <svg class="hills-layer" viewBox="0 0 1200 400" preserveAspectRatio="none"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5a9e2f"/><stop offset="100%" stop-color="#3d7a1a"/>
      </linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6db33f"/><stop offset="100%" stop-color="#4a9020"/>
      </linearGradient>
      <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#82c952"/><stop offset="100%" stop-color="#5aaa2a"/>
      </linearGradient>
    </defs>
    <!-- far hill -->
    <path d="M-50,400 Q100,60 300,120 Q450,170 600,80 Q750,10 900,100 Q1050,170 1250,60 L1250,400 Z"
          fill="url(#h1)" opacity="0.7"/>
    <!-- mid hill -->
    <path d="M-50,400 Q50,180 200,200 Q380,220 500,140 Q650,60 800,160 Q950,230 1100,150 Q1200,110 1250,140 L1250,400 Z"
          fill="url(#h2)"/>
    <!-- fore hill -->
    <path d="M-50,400 Q100,280 250,260 Q400,240 550,290 Q700,330 850,270 Q1000,220 1150,280 Q1200,300 1250,290 L1250,400 Z"
          fill="url(#h3)"/>
    <!-- cypress trees -->
    <g fill="#2d5a10" opacity="0.9">
      <ellipse cx="558" cy="108" rx="7" ry="22"/>
      <ellipse cx="573" cy="112" rx="6" ry="18"/>
      <ellipse cx="588" cy="107" rx="7" ry="23"/>
      <ellipse cx="620" cy="72" rx="7" ry="24"/>
      <ellipse cx="635" cy="68" rx="6" ry="19"/>
      <ellipse cx="200" cy="194" rx="8" ry="28"/>
      <ellipse cx="217" cy="191" rx="7" ry="24"/>
      <ellipse cx="235" cy="195" rx="8" ry="27"/>
      <ellipse cx="820" cy="152" rx="8" ry="28"/>
      <ellipse cx="837" cy="149" rx="7" ry="23"/>
      <!-- small house -->
      <rect x="455" y="130" width="28" height="22" fill="#c8955a"/>
      <polygon points="450,130 497,130 473,110" fill="#a0523a"/>
      <rect x="465" y="138" width="8" height="14" fill="#7a3a1a"/>
    </g>
    <!-- road base -->
    <rect x="0" y="350" width="1200" height="50" fill="#555"/>
    <rect x="0" y="371" width="1200" height="5" fill="rgba(255,215,0,0.4)"/>
  </svg>

  <!-- CAR SCENE -->
  <div class="car-scene" id="carScene">
    <!-- Speed lines -->
    <div class="speed-lines">
      <div class="speed-line" style="width:150px"></div>
      <div class="speed-line" style="width:110px; margin-right:15px"></div>
      <div class="speed-line" style="width:175px"></div>
      <div class="speed-line" style="width:95px; margin-right:10px"></div>
      <div class="speed-line" style="width:130px"></div>
    </div>

    <!-- CAR SVG with person + photo face -->
    <svg class="car-svg" viewBox="0 0 260 145" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#cc3333"/>
        </linearGradient>
        <linearGradient id="cWin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#aee4ff"/><stop offset="100%" stop-color="#7cc8f0"/>
        </linearGradient>
        <radialGradient id="wGrad" cx="50%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#666"/><stop offset="100%" stop-color="#222"/>
        </radialGradient>
        <!-- CLIP CIRCLE for face photo -->
        <clipPath id="faceClip">
          <circle cx="148" cy="18" r="19"/>
        </clipPath>
      </defs>

      <!-- car body -->
      <rect x="20" y="72" width="220" height="46" rx="8" fill="url(#cBody)"/>
      <!-- roof -->
      <path d="M 60,72 Q 72,30 100,28 L 185,28 Q 205,28 218,50 L218,72 Z" fill="#e04444"/>
      <!-- windshield -->
      <path d="M 70,70 Q 80,36 104,34 L 170,34 Q 190,34 210,56 L210,70 Z"
            fill="url(#cWin)" opacity="0.85"/>
      <path d="M 80,65 Q 88,40 108,38 L 128,38 L 118,67 Z" fill="rgba(255,255,255,0.3)"/>
      <!-- front bumper -->
      <path d="M 220,76 Q 248,76 250,90 L 240,102 L218,102 Z" fill="#bb2222"/>
      <!-- headlight -->
      <ellipse cx="238" cy="84" rx="7" ry="5" fill="#fffbe0"/>
      <ellipse cx="238" cy="84" rx="4" ry="3" fill="#ffff88"/>
      <!-- rear end -->
      <path d="M20,73 L13,73 Q8,73 8,81 L8,98 L20,98 Z" fill="#bb2222"/>
      <ellipse cx="10" cy="87" rx="4" ry="6" fill="#ff4444" opacity="0.8"/>
      <!-- door lines -->
      <line x1="140" y1="72" x2="140" y2="116" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
      <!-- undercarriage -->
      <rect x="25" y="114" width="210" height="7" rx="3" fill="#991111"/>
      <!-- wheels -->
      <circle cx="68" cy="118" r="21" fill="#222"/>
      <circle cx="68" cy="118" r="15" fill="url(#wGrad)"
              style="transform-origin:68px 118px; animation:wheelSpin 0.4s linear infinite"/>
      <circle cx="68" cy="118" r="5" fill="#888"/>
      <circle cx="196" cy="118" r="21" fill="#222"/>

  const photoSrc = 'data:image/jpeg;base64,' + photoB64;
  document.querySelector('image[href="PHOTO_PLACEHOLDER"]').setAttribute('href', photoSrc);

  // ---- Confetti ----
  const confetti = document.getElementById('confetti');
  const colors = ['#f5d878','#ff6b6b','#6db33f','#87ceeb','#ff9e5e','#fff','#c9a227'];
  for(let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random()*colors.length)];
    const size = Math.random()*10+5;
    p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;` +
      `animation-duration:${Math.random()*4+4}s;animation-delay:${Math.random()*5}s;` +
      `background:${color};border-radius:${Math.random()>0.5?'50%':'2px'};`;
    confetti.appendChild(p);
  }

  // ---- Page transitions ----
  function showPage2() {
    document.getElementById('page1').classList.add('hidden');
    setTimeout(() => document.getElementById('page2').classList.add('visible'), 200);
  }

  function goBack() {
    document.getElementById('page2').classList.remove('visible');
    setTimeout(() => {
      document.getElementById('page1').classList.remove('hidden');
    }, 600);
  }
